<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esperando autorización · SalvadoreX</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --accent:#22c55e; --muted:#94a3b8; --text:#f1f5f9; --border:#334155; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text);
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:18px; max-width:460px; width:100%;
          padding:40px 32px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.4); }
  .logo { font-size:26px; font-weight:800; letter-spacing:-.5px; margin-bottom:8px; }
  .logo span { color:var(--accent); }
  .spinner { width:56px; height:56px; margin:24px auto; border:4px solid var(--border);
             border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  h1 { font-size:20px; margin-bottom:12px; }
  p { color:var(--muted); line-height:1.6; font-size:15px; margin-bottom:8px; }
  .badge { display:inline-block; background:rgba(34,197,94,.12); color:var(--accent); border:1px solid rgba(34,197,94,.35);
           padding:6px 14px; border-radius:999px; font-size:13px; font-weight:600; margin:16px 0; }
  .rejected .badge { background:rgba(239,68,68,.12); color:#f87171; border-color:rgba(239,68,68,.35); }
  .rejected .spinner { display:none; }
  .status { font-size:13px; color:var(--muted); margin-top:16px; min-height:18px; }
  button { margin-top:24px; background:transparent; color:var(--muted); border:1px solid var(--border);
           padding:11px 22px; border-radius:10px; font-size:14px; cursor:pointer; transition:.15s; }
  button:hover { border-color:var(--accent); color:var(--text); }
  .email { color:var(--text); font-weight:600; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="logo">Salvador<span>eX</span></div>
    <div class="spinner" id="spin"></div>
    <div class="badge" id="badge">En revisión</div>
    <h1 id="title">Tu cuenta está pendiente de autorización</h1>
    <p id="msg">Tu registro se creó correctamente. Un administrador debe <strong>autorizar tu prueba</strong> antes de que puedas entrar. Te avisaremos en cuanto se active.</p>
    <p class="email" id="email"></p>
    <div class="status" id="statusLine"></div>
    <button onclick="cerrarSesion()">Cerrar sesión</button>
  </div>
<script>
(function(){
  var tok = localStorage.getItem('volvix_token') || localStorage.getItem('volvixAuthToken');
  var gate = '';
  try { gate = sessionStorage.getItem('vlx_gate') || ''; } catch(_){}
  // mostrar email si hay sesión guardada
  try {
    var sess = JSON.parse(localStorage.getItem('volvix_session') || localStorage.getItem('volvixSession') || '{}');
    if (sess && sess.email) document.getElementById('email').textContent = sess.email;
  } catch(_){}

  if (gate === 'TENANT_REJECTED') {
    document.getElementById('card').className = 'card rejected';
    document.getElementById('badge').textContent = 'Registro rechazado';
    document.getElementById('title').textContent = 'Tu registro no fue aprobado';
    document.getElementById('msg').innerHTML = 'Un administrador rechazó esta solicitud. Si crees que es un error, contacta a soporte.';
    return;
  }

  if (!tok) { location.replace('/login.html'); return; }

  var tries = 0;
  var statusEl = document.getElementById('statusLine');
  function poll(){
    tries++;
    fetch('/api/tenant/gate-status', { headers: { 'Authorization': 'Bearer ' + tok }, cache:'no-store' })
      .then(function(r){
        if (r.status === 200) {
          statusEl.textContent = '¡Autorizado! Entrando…';
          try { sessionStorage.removeItem('vlx_gate'); } catch(_){}
          setTimeout(function(){ location.replace('/salvadorex-pos.html'); }, 800);
          return;
        }
        if (r.status === 401) { location.replace('/login.html'); return; }
        // 403 -> sigue pendiente; revisar si pasó a rechazado
        return r.clone().json().then(function(j){
          if (j && j.error_code === 'TENANT_REJECTED') {
            document.getElementById('card').className = 'card rejected';
            document.getElementById('badge').textContent = 'Registro rechazado';
            document.getElementById('title').textContent = 'Tu registro no fue aprobado';
            document.getElementById('msg').innerHTML = 'Un administrador rechazó esta solicitud. Contacta a soporte.';
            return true;
          }
          return false;
        }).catch(function(){ return false; }).then(function(stop){
          if (stop) return;
          statusEl.textContent = 'Esperando autorización… (revisado ' + tries + ' ' + (tries===1?'vez':'veces') + ')';
          setTimeout(poll, 20000);
        });
      })
      .catch(function(){ statusEl.textContent = 'Sin conexión, reintentando…'; setTimeout(poll, 20000); });
  }
  poll();
})();
function cerrarSesion(){
  try {
    localStorage.removeItem('volvix_token'); localStorage.removeItem('volvixAuthToken');
    localStorage.removeItem('volvix_session'); localStorage.removeItem('volvixSession');
    sessionStorage.removeItem('vlx_gate');
  } catch(_){}
  location.replace('/login.html');
}
</script>
</body>
</html>
