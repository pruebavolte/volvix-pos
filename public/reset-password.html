<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'; object-src 'none'" />
  <title>Restablecer contraseña | Volvix POS</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --ink: #111827;
      --muted: #64748b;
      --border: #dbe3ef;
      --primary: #0f766e;
      --primary-dark: #115e59;
      --danger: #b91c1c;
      --ok: #166534;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top left, #ecfeff, transparent 34%), var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(440px, calc(100vw - 32px));
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 24px 80px rgba(15, 23, 42, .12);
      padding: 28px;
    }
    .brand {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), #22c55e);
      font-weight: 800;
      margin-bottom: 18px;
    }
    h1 { font-size: 24px; line-height: 1.15; margin: 0 0 8px; }
    p { margin: 0 0 22px; color: var(--muted); line-height: 1.45; }
    label { display: block; font-size: 13px; font-weight: 700; margin: 14px 0 6px; }
    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 13px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15, 118, 110, .13); }
    button, .login-link {
      width: 100%;
      margin-top: 18px;
      border: 0;
      border-radius: 12px;
      padding: 13px 16px;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    button:disabled { opacity: .65; cursor: wait; }
    button:not(:disabled):hover { background: var(--primary-dark); }
    .login-link { display: none; }
    .alert {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
    }
    .alert.error { display: block; color: var(--danger); background: #fef2f2; border: 1px solid #fecaca; }
    .alert.ok { display: block; color: var(--ok); background: #f0fdf4; border: 1px solid #bbf7d0; }
    .hint { margin-top: 14px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">V</div>
    <h1>Restablece tu contraseña</h1>
    <p>Crea una contraseña nueva para la misma cuenta con la que ingresas a Volvix POS.</p>

    <form id="resetPasswordForm">
      <label for="newPassword">Nueva contraseña</label>
      <input id="newPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="128" />

      <label for="confirmPassword">Confirmar nueva contraseña</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="128" />

      <button id="submitBtn" type="submit">Guardar contraseña</button>
      <div id="alertBox" class="alert" role="alert" aria-live="polite"></div>
      <a id="loginLink" class="login-link" href="/login.html">Ir a iniciar sesión</a>
      <div class="hint">El enlace es personal y expira. No lo compartas.</div>
    </form>
  </main>

  <script>
    (function () {
      const form = document.getElementById('resetPasswordForm');
      const btn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('alertBox');
      const loginLink = document.getElementById('loginLink');
      const params = new URLSearchParams(window.location.search);
      const resetToken = String(params.get('token') || '').trim();
      const confirmEndpoint = resetToken.split('.').length === 3
        ? '/api/auth/password-reset/confirm'
        : '/api/auth/reset';

      history.replaceState(null, '', window.location.pathname);

      function show(message, type) {
        alertBox.textContent = message;
        alertBox.className = 'alert ' + (type || 'error');
      }

      if (!resetToken || resetToken.length > 4096) {
        show('El enlace es inválido o ya no está disponible. Solicita uno nuevo.', 'error');
        btn.disabled = true;
      }

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        const next = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;
        if (next.length < 8 || next.length > 128) {
          return show('La contraseña debe tener entre 8 y 128 caracteres.', 'error');
        }
        if (next !== confirm) return show('La confirmación no coincide.', 'error');

        btn.disabled = true;
        btn.textContent = 'Guardando...';
        alertBox.className = 'alert';
        alertBox.textContent = '';

        try {
          const response = await fetch(confirmEndpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: resetToken, new_password: next }),
          });
          const result = await response.json().catch(function () { return {}; });
          if (!response.ok || !result.ok) {
            throw new Error(result.error || result.message || 'No se pudo restablecer la contraseña');
          }
          form.querySelectorAll('input').forEach(function (input) { input.value = ''; });
          show('Contraseña actualizada. Ya puedes iniciar sesión.', 'ok');
          btn.style.display = 'none';
          loginLink.style.display = 'block';
        } catch (error) {
          show(error.message || 'No se pudo restablecer la contraseña', 'error');
          btn.disabled = false;
          btn.textContent = 'Guardar contraseña';
        }
      });
    })();
  </script>
</body>
</html>
